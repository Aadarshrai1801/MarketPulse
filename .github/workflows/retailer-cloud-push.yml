# Daily cloud push for the "green" retailer set (see GREEN_RETAILERS in
# scripts/push_retailer.py): every retailer GitHub Actions (Azure) egress
# can reach, verified by retailer-egress-probe.yml.
#
# Why this exists: an IP/geo edge can block one hosting provider (Render
# gets 405 on Unioncoop) while allowing another (Azure returns 200 for
# carrefour/lulu/barakat/kibsons). The hosted app skips what it can't
# reach (DISABLED_RETAILERS); this workflow writes the same records
# (price_history + latest_fetch) into the same MongoDB - the dashboard
# reads from Mongo, so coverage is complete without proxies or a local PC.
#
# Known stockouts (catalog.RETAILER_PRODUCT_SKIPS, e.g. Barakat navel
# oranges, delisted site-wide) log as SKIP, not FAIL, so the run stays
# green while the gap stays visible in its log.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   MONGODB_URI   - same Atlas connection string as Render
#   MONGO_DB_NAME - same database name as Render (must match!)
#
# Free-tier cost: one ~5 min run/day, ~1-2% of the 2,000 min/month allowance.

name: Retailer cloud push

on:
  workflow_dispatch:
    inputs:
      retailer:
        description: "Retailer set ('green' = daily cloud set)"
        required: true
        type: choice
        options:
          - green
          - all
          - carrefour
          - lulu
          - barakat
          - kibsons
          - unioncoop
        default: green
  schedule:
    # 01:00 UTC = 05:00 GST (UAE) daily
    - cron: "0 1 * * *"

# One run at a time - never overlap pushes into the same collections.
concurrency:
  group: retailer-cloud-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scheduled ticks push the green set; manual dispatch uses the dropdown.
      - name: Pick retailer set
        id: pick
        run: |
          r="green"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            r="${{ inputs.retailer }}"
          fi
          echo "retailer=$r" >> "$GITHUB_OUTPUT"
          echo "Selected retailer set: $r"

      - name: Scrape and push to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        run: python scripts/push_retailer.py --retailer ${{ steps.pick.outputs.retailer }}
